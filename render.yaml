# Blueprint de Render para el Web API (el frontend se publica en GitHub Pages).
# Render > New > Blueprint > selecciona este repositorio.
services:
  - type: web
    name: subastas-copart-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://henrygonz10.github.io
